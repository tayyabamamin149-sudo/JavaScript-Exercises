<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        } */

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            background: linear-gradient(130deg, #f5f7fa, #c3cfe2);
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 250px;
        }

        h1 {
            font-size: 30px;
            color: #333;
            margin-bottom: 30px;
        }

        #counter {
            font-size: 64px;
            font-weight: bold;
            color: #222;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            color: white;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        

        .btn-minus {
            background-color: #ff4d4d;
        }

        

        .btn-plus {
            background-color: #2ecc71;
        }

        

        .btn-reset {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Counter App</h1>
        <div id="counter">0</div>
        
        <div class="buttons">
            <button class="btn btn-minus" onclick="updateCount(-1)">-</button>
            <button class="btn btn-plus" onclick="updateCount(1)">+</button>
        </div>

        <button class="btn-reset" onclick="resetCount()">Reset</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
