<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 40vh;
    }

    
    .phone-container {
      width: 340px;
      height: 530px;
      background-color: #000000;
      border-radius: 40px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
    }

    .display {
      width: 100%;
      height: 180px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 20px 10px;
      color: #ffffff;
      font-size: 56px;
      font-weight: 300;
      word-break: break-all;
    }

    
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-bottom: 20px;
    }

    
    .btn {
      background-color: #333333;
      color: #ffffff;
      border: none;
      height: 65px;
      border-radius: 16px;
      font-size: 30px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
     
      
    }

    

    
    .btn-zero {
      grid-column: span 2;
      border-radius: 16px;
    }

    
    .btn-equals {
      background-color: #444444;
    }

    .btn-equals:active {
      background-color: #666666;
    }
    </style>
</head>
<body>
    <div class="phone-container">
    
    <div class="display" id="display">0</div>

    
    <div class="keypad">
      <button class="btn" onclick="clearDisplay()">C</button>
      <button class="btn" onclick="toggleSign()">+/-</button>
      <button class="btn" onclick="percentage()">%</button>
      <button class="btn" onclick="appendOperator('÷')">÷</button>

      <button class="btn" onclick="appendNumber('7')">7</button>
      <button class="btn" onclick="appendNumber('8')">8</button>
      <button class="btn" onclick="appendNumber('9')">9</button>
      <button class="btn" onclick="appendOperator('×')">X</button>

      <button class="btn" onclick="appendNumber('4')">4</button>
      <button class="btn" onclick="appendNumber('5')">5</button>
      <button class="btn" onclick="appendNumber('6')">6</button>
      <button class="btn" onclick="appendOperator('-')">-</button>

      <button class="btn" onclick="appendNumber('1')">1</button>
      <button class="btn" onclick="appendNumber('2')">2</button>
      <button class="btn" onclick="appendNumber('3')">3</button>
      <button class="btn" onclick="appendOperator('+')">+</button>

      <button class="btn btn-zero" onclick="appendNumber('0')">0</button>
      <button class="btn" onclick="appendDot()">.</button>
      <button class="btn btn-equals" onclick="calculate()">=</button>
    </div>
  </div>







    <script src="app.js"></script>
</body>
</html>
